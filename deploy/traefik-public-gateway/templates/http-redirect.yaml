{{- if .Values.redirect.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.redirect.name | quote }}
  labels:
    {{- include "traefik-public-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | quote }}
      sectionName: {{ .Values.gateway.httpListenerName | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: {{ .Values.redirect.scheme | quote }}
            statusCode: {{ .Values.redirect.statusCode }}
{{- end }}
