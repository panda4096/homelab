apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
{{- if .Values.nodePort.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-nodeport
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
      nodePort: {{ .Values.nodePort.port }}
{{- end }}
