fullnameOverride: postgresql

auth:
  existingSecret: postgresql-admin
  secretKeys:
    adminPasswordKey: postgres-password

primary:
  nodeSelector:
    region: gz
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  initdb:
    scriptsSecret: postgresql-init-scripts

metrics:
  enabled: false

volumePermissions:
  enabled: false

readReplicas:
  replicaCount: 0

backup:
  enabled: false
