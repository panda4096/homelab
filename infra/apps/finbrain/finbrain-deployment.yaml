apiVersion: apps/v1
kind: Deployment
metadata:
  name: finbrain
  namespace: finbrain
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finbrain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finbrain
    spec:
      nodeSelector:
        region: gz
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: finbrain-uploads
      containers:
        - name: finbrain
          image: butcoder/finbrain-ingest-agent:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: finbrain-config
            - secretRef:
                name: finbrain-app-secrets
          volumeMounts:
            - name: uploads
              mountPath: /var/finbrain/uploads
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
