apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: finbrain
  namespace: finbrain
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /finbrain/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: finbrain-authelia-forwardauth
      backendRefs:
        - name: finbrain
          port: 80
