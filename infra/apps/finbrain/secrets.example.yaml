# Reference template only — real values flow through scripts/apply-secrets.sh
# which reads infra/.secrets/postgresql.env and infra/.secrets/finbrain.env and
# generates the live Secret objects. Do not kubectl apply this file directly.

apiVersion: v1
kind: Secret
metadata:
  name: finbrain-app-secrets
  namespace: finbrain
type: Opaque
stringData:
  # Assembled at apply time as
  #   postgresql+psycopg://finbrain:${FINBRAIN_DB_PASSWORD}@postgresql.data.svc.cluster.local:5432/finbrain
  FINBRAIN_DATABASE_URL: postgresql+psycopg://finbrain:REPLACE_ME@postgresql.data.svc.cluster.local:5432/finbrain
  FINBRAIN_FIREFLY_TOKEN: REPLACE_ME
  FINBRAIN_GHOSTFOLIO_TOKEN: REPLACE_ME
---
# The backup CronJob currently references these fields, but the S3 values were
# generated as a placeholder by an earlier agent run and are NOT actually
# configured. Do not populate this Secret; the CronJob will be replaced in a
# follow-up change that decides pg + uploads backup strategy. Listed here only
# so the CronJob manifest keeps a valid secretRef target.
apiVersion: v1
kind: Secret
metadata:
  name: finbrain-backup-secrets
  namespace: finbrain
type: Opaque
stringData:
  POSTGRES_USER: finbrain
  POSTGRES_PASSWORD: REPLACE_ME
  BACKUP_PASSPHRASE: REPLACE_ME
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  AWS_DEFAULT_REGION: ap-east-1
  S3_BUCKET: REPLACE_ME
