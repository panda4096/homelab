apiVersion: batch/v1
kind: CronJob
metadata:
  name: finbrain-db-backup
  namespace: finbrain
  annotations:
    homelab/status: "待改造"
    homelab/note: |
      This CronJob is suspended until the shared data layer backup story is
      decided in a follow-up change. Original host `finbrain-postgres` no
      longer exists (the per-app Postgres StatefulSet was removed when the
      data layer was extracted into infra/data/postgresql). The external S3
      fields in finbrain-backup-secrets were never actually configured. A
      subsequent change will rewrite the host to the shared data layer and
      choose a real backup destination (intra-cluster two-node replication
      or genuine external object storage).
spec:
  suspend: true
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pgdump
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: finbrain-backup-secrets
              command:
                - /bin/sh
                - -lc
                - |
                  set -euo pipefail
                  apk add --no-cache aws-cli openssl
                  export PGPASSWORD="${POSTGRES_PASSWORD}"
                  ts="$(date +%Y%m%d-%H%M%S)"
                  pg_dump -h postgresql.data.svc.cluster.local -U "${POSTGRES_USER}" -d finbrain \
                    | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE \
                    | aws s3 cp - "s3://${S3_BUCKET}/finbrain/${ts}.sql.enc"
