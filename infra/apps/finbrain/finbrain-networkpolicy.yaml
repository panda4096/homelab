apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finbrain-from-traefik-only
  namespace: finbrain
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finbrain
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: traefik-traefik
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
