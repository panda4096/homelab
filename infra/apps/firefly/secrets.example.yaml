# Reference template only — real values flow through scripts/apply-secrets.sh
# which reads infra/.secrets/postgresql.env and infra/.secrets/firefly.env and
# generates the live Secret objects. Do not kubectl apply this file directly.

apiVersion: v1
kind: Secret
metadata:
  name: firefly-app-secrets
  namespace: firefly
type: Opaque
stringData:
  APP_KEY: base64:REPLACE_ME
  SITE_OWNER: you@example.com
---
# Connection to shared data/postgresql. postgres-user is fixed to `firefly`;
# postgres-password comes from FIREFLY_DB_PASSWORD in infra/.secrets/postgresql.env.
apiVersion: v1
kind: Secret
metadata:
  name: firefly-db-credentials
  namespace: firefly
type: Opaque
stringData:
  postgres-user: firefly
  postgres-password: REPLACE_ME
