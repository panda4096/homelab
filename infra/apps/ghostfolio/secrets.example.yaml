# Reference template only — real values flow through scripts/apply-secrets.sh
# which reads infra/.secrets/postgresql.env and infra/.secrets/ghostfolio.env and
# generates the live Secret objects. Do not kubectl apply this file directly.

apiVersion: v1
kind: Secret
metadata:
  name: ghostfolio-app-secrets
  namespace: ghostfolio
type: Opaque
stringData:
  ACCESS_TOKEN_SALT: REPLACE_ME
  JWT_SECRET_KEY: REPLACE_ME
  OIDC_CLIENT_SECRET: REPLACE_ME
  NODE_USE_ENV_PROXY: "0"
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  NO_PROXY: "127.0.0.1,localhost,ghostfolio-redis,postgresql.data.svc.cluster.local,.svc,.cluster.local,kubernetes.default.svc"
  http_proxy: ""
  https_proxy: ""
  no_proxy: "127.0.0.1,localhost,ghostfolio-redis,postgresql.data.svc.cluster.local,.svc,.cluster.local,kubernetes.default.svc"
---
# Connection to shared data/postgresql. Ghostfolio reads DATABASE_URL directly;
# assembled at apply time as
#   postgresql://ghostfolio:${GHOSTFOLIO_DB_PASSWORD}@postgresql.data.svc.cluster.local:5432/ghostfolio?schema=public
apiVersion: v1
kind: Secret
metadata:
  name: ghostfolio-db-credentials
  namespace: ghostfolio
type: Opaque
stringData:
  database-url: postgresql://ghostfolio:REPLACE_ME@postgresql.data.svc.cluster.local:5432/ghostfolio?schema=public
---
# Ghostfolio's own Redis cache remains under infra/apps/ghostfolio for now.
# Planned to migrate to infra/data/redis/ in a follow-up change.
apiVersion: v1
kind: Secret
metadata:
  name: ghostfolio-redis-secrets
  namespace: ghostfolio
type: Opaque
stringData:
  redis-password: REPLACE_ME
