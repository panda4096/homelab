apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostfolio
  namespace: ghostfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ghostfolio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghostfolio
    spec:
      nodeSelector:
        region: gz
      initContainers:
        - name: patch-basehref
          image: ghostfolio/ghostfolio:2.254.0
          command: ["/bin/sh", "/scripts/patch-basehref.sh"]
          volumeMounts:
            # Mount emptyDir at a DIFFERENT path so the image's original
            # /ghostfolio/apps/client is still visible for copying.
            - name: patched-client
              mountPath: /patched-client
            - name: init-scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: patched-client
          emptyDir: {}
        - name: init-scripts
          configMap:
            name: ghostfolio-init-basehref
            defaultMode: 0755
      containers:
        - name: ghostfolio
          image: ghostfolio/ghostfolio:2.254.0
          ports:
            - containerPort: 3333
              name: http
          envFrom:
            - configMapRef:
                name: ghostfolio-config
            - secretRef:
                name: ghostfolio-app-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ghostfolio-db-credentials
                  key: database-url
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghostfolio-redis-secrets
                  key: redis-password
          volumeMounts:
            # Mount the patched files over the original client directory
            - name: patched-client
              mountPath: /ghostfolio/apps/client
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
