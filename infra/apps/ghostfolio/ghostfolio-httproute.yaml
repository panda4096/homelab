apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ghostfolio
  namespace: ghostfolio
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    # Rule 1: Exact /ghostfolio or /ghostfolio/ → redirect to Ghostfolio's OIDC
    # start endpoint once ForwardAuth has validated the Authelia session.
    - matches:
        - path:
            type: Exact
            value: /ghostfolio
        - path:
            type: Exact
            value: /ghostfolio/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ghostfolio-authelia-forwardauth
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ghostfolio-redirect-to-oidc
      backendRefs:
        - name: ghostfolio
          port: 80
    # Rule 2: /ghostfolio/<locale>/... → StripPrefix → Ghostfolio serves SPA
    - matches:
        - path:
            type: PathPrefix
            value: /ghostfolio/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ghostfolio-authelia-forwardauth
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ghostfolio-strip-prefix
      backendRefs:
        - name: ghostfolio
          port: 80
    # Rule 3: /api/v1/... → Ghostfolio API (no strip needed)
    # Angular SPA uses absolute "/api/v1/..." paths for HTTP calls.
    # This rule catches those and forwards directly to Ghostfolio.
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ghostfolio-authelia-forwardauth
      backendRefs:
        - name: ghostfolio
          port: 80
