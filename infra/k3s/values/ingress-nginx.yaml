# Helm values for ingress-nginx (keep in git; install/upgrade must reference this file).
controller:
  replicaCount: 1
  ingressClassResource:
    name: nginx
    default: true
  service:
    type: NodePort
  config:
    proxy-read-timeout: "3600"
    proxy-send-timeout: "3600"
    client-max-body-size: "50m"
