# Source of truth: component versions + important paths.
#
# Any upgrade/change should update this file first, and be referenced by a change record in infra/changes/.
k3s:
  # Empty string means "install latest stable" and then record the actual version after installation.
  version: "v1.34.4+k3s1"
  data_dir: /var/lib/rancher/k3s
kilo:
  version: "0.6.0"
  crds_url: "https://raw.githubusercontent.com/squat/kilo/0.6.0/manifests/crds.yaml"
  crds_path: "infra/k3s/manifests/kilo-crds.yaml"
  manifest_url: "https://raw.githubusercontent.com/squat/kilo/0.6.0/manifests/kilo-k3s.yaml"
  manifest_path: "infra/k3s/manifests/kilo-k3s.yaml"
ingress:
  controller: "ingress-nginx"
  chart:
    repo: "https://kubernetes.github.io/ingress-nginx"
    name: "ingress-nginx/ingress-nginx"
    # Pin the chart version used in the cluster and record it here.
    version: "4.14.3"
    package_path: "infra/platform/ingress-nginx/charts/ingress-nginx-4.14.3.tgz"
  values_path: "infra/platform/ingress-nginx/values.yaml"
monitoring:
  stack: "victoria-metrics-k8s-stack"
  namespace: "monitoring"
  retention: "30d"
  chart:
    repo: "https://victoriametrics.github.io/helm-charts/"
    name: "victoria-metrics-k8s-stack"
    version: "0.72.5"
    package_path: "infra/platform/monitoring/charts/victoria-metrics-k8s-stack-0.72.5.tgz"
  values_path: "infra/platform/monitoring/victoria-metrics-k8s-stack/values.yaml"
  network:
    docs_path: "infra/05-网络探测与链路监控.md"
    manifests_path: "infra/platform/monitoring/network/"
    blackbox_exporter:
      image: "quay.io/prometheus/blackbox-exporter:v0.28.0"
      config_path: "infra/platform/monitoring/network/phase1-probes/blackbox.yml"
    wireguard_exporter:
      image: "mindflavor/prometheus-wireguard-exporter:3.6.6"
      manifests_path: "infra/platform/monitoring/network/phase2-link-metrics/"
    dashboards:
      inter_node_network_uid: "infra-inter-node-network"
      endpoint_reachability_uid: "infra-endpoint-reachability"
      wireguard_underlay_uid: "infra-wireguard-underlay"
      node_network_health_uid: "infra-node-network-health"
