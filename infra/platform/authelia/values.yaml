image:
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  gatewayAPI:
    enabled: true
    hostnamesOverride:
      - "106.55.163.135"
    parentRefs:
      - name: public-gateway
        namespace: traefik
        sectionName: websecure

configMap:
  server:
    path: auth
  theme: dark
  default_2fa_method: ""
  authentication_backend:
    file:
      enabled: true
      path: /secrets/users/users_database.yml
      search:
        email: true
        case_insensitive: true
  access_control:
    default_policy: one_factor
  session:
    same_site: lax
    expiration: 8 hours
    inactivity: 1 hour
    remember_me: 1 month
    encryption_key:
      disabled: false
      secret_name: authelia-secrets
      path: session.encryption.key
    cookies:
      - domain: "106.55.163.135"
        path: auth
        authelia_url: https://106.55.163.135/auth
        default_redirection_url: https://106.55.163.135/home/
  storage:
    encryption_key:
      disabled: false
      secret_name: authelia-secrets
      path: storage.encryption.key
    local:
      enabled: true
      path: /config/db.sqlite3
  notifier:
    filesystem:
      enabled: false
      filename: /config/notification.txt
    smtp:
      enabled: true
      address: submissions://smtp.qq.com:465
      sender: "Panda <948533564@qq.com>"
      identifier: "106.55.163.135"
      subject: "[Authelia] {title}"
      startup_check_address: 948533564@qq.com
      username: 948533564@qq.com
      password:
        disabled: false
        secret_name: authelia-secrets
        path: notifier.smtp.password.txt

secret:
  existingSecret: authelia-secrets
  additionalSecrets:
    authelia-secrets: {}
    authelia-users:
      path: users
      items:
        - key: users_database.yml
          path: users_database.yml

persistence:
  enabled: true
  storageClass: local-path
  accessModes:
    - ReadWriteOnce
  size: 1Gi

pod:
  kind: Deployment
  replicas: 1
  selectors:
    nodeSelector:
      region: gz
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
