apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-portal
  namespace: portal
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /home
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: portal-authelia-forwardauth
      backendRefs:
        - name: public-portal
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: public-portal
          port: 80
