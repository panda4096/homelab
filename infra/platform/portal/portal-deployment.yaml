apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-portal
  namespace: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: public-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-portal
    spec:
      nodeSelector:
        region: gz
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: portal-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: portal-config
              mountPath: /usr/share/nginx/html/home.html
              subPath: home.html
            - name: portal-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: portal-config
          configMap:
            name: public-portal
