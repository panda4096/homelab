apiVersion: v1
kind: ConfigMap
metadata:
  name: public-portal
  namespace: portal
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location = / {
        try_files /index.html =404;
      }

      location = /home {
        return 302 /home/;
      }

      location = /home/ {
        try_files /home.html =404;
      }

      location = /index.html { try_files /index.html =404; }
      location = /home.html { try_files /home.html =404; }
    }
  index.html: |
    <!doctype html>
    <html lang="zh-CN">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>HomeLab Access</title>
        <style>
          :root {
            --paper: #f4efe6;
            --ink: #171512;
            --muted: #6f6558;
            --panel: rgba(255, 248, 235, 0.8);
            --line: rgba(23, 21, 18, 0.12);
            --accent: #d65d0e;
            --accent-2: #1f6b5b;
            --shadow: 0 30px 80px rgba(33, 26, 18, 0.16);
          }

          * { box-sizing: border-box; }

          body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background:
              radial-gradient(circle at top left, rgba(214, 93, 14, 0.18), transparent 34%),
              radial-gradient(circle at right 20%, rgba(31, 107, 91, 0.16), transparent 28%),
              linear-gradient(160deg, #f8f1e4 0%, #ece1cf 52%, #e5d5c0 100%);
            font-family: "Avenir Next", "Segoe UI", sans-serif;
          }

          .shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 72px;
          }

          .hero {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 36px;
            background:
              linear-gradient(135deg, rgba(255,255,255,0.74), rgba(255,247,232,0.58)),
              rgba(255,255,255,0.55);
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow);
          }

          .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(23, 21, 18, 0.05);
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }

          .eyebrow::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
          }

          h1 {
            margin: 20px 0 12px;
            max-width: 680px;
            font-family: Iowan Old Style, "Palatino Linotype", "Book Antiqua", Palatino, serif;
            font-size: clamp(40px, 7vw, 72px);
            line-height: 0.94;
            letter-spacing: -0.04em;
          }

          .lead {
            max-width: 620px;
            margin: 0;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.65;
          }

          .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 26px;
          }

          .chip {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.45);
            font-size: 13px;
            color: var(--muted);
          }

          .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }

          .action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 152px;
            padding: 13px 18px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
          }

          .action:hover { transform: translateY(-1px); }

          .action.primary {
            color: #fff8ef;
            background: linear-gradient(135deg, var(--accent), #c74900);
            box-shadow: 0 12px 28px rgba(214, 93, 14, 0.28);
          }

          .action.secondary {
            color: var(--ink);
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.54);
          }

          .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.9fr);
            gap: 22px;
            margin-top: 24px;
          }

          .card {
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            background: var(--panel);
            box-shadow: 0 12px 40px rgba(40, 29, 19, 0.08);
          }

          .card h2, .card h3 {
            margin: 0;
            font-family: Iowan Old Style, "Palatino Linotype", "Book Antiqua", Palatino, serif;
            letter-spacing: -0.03em;
          }

          .primary { display: grid; gap: 20px; }

          .panel-copy {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
            margin-top: 14px;
          }

          .caption { margin-top: 18px; color: var(--muted); font-size: 13px; line-height: 1.65; }

          @media (max-width: 860px) {
            .shell { padding: 20px 16px 48px; }
            .hero { padding: 24px; border-radius: 24px; }
            .grid { grid-template-columns: 1fr; }
          }
        </style>
      </head>
      <body>
        <main class="shell">
          <section class="hero">
            <span class="eyebrow">Public Entry</span>
            <h1>HomeLab Access</h1>
            <p class="lead">
              当前首页只保留统一登录入口，不展示内部系统清单。完成认证后会跳转到真正的门户页，再进入内部服务。
            </p>
            <div class="meta">
              <span class="chip">GZ Public Edge</span>
              <span class="chip">Traefik + Gateway API</span>
              <span class="chip">Authelia SSO</span>
            </div>
            <div class="actions">
              <a class="action primary" href="/auth/?rd=https%3A%2F%2F106.55.163.135%2Fhome%2F">登录认证</a>
            </div>
            <div class="grid">
              <section class="primary">
                <div class="card">
                  <h2>Sign In First</h2>
                  <p class="panel-copy">
                    当前首页对匿名访问者只保留统一认证入口。登录成功后，系统会把你带到受保护的门户页，在那里再展示可访问的内部系统。
                  </p>
                </div>
              </section>
              <aside class="side">
                <section class="card">
                  <h3>Access Model</h3>
                  <p class="caption">
                    先进入统一认证，再进入受保护的门户页和内部系统。这样能把公开首页和内部资源入口分成两个层次，减少匿名态信息暴露。
                  </p>
                </section>
              </aside>
            </div>
          </section>
        </main>
        <script>
          async function redirectAuthenticatedUsers() {
            try {
              const response = await fetch("/grafana/api/health", {
                credentials: "include",
                redirect: "follow",
                headers: { Accept: "application/json" }
              });
              const contentType = response.headers.get("content-type") || "";
              const finalUrl = response.url || "";
              const authenticated =
                response.ok &&
                finalUrl.includes("/grafana/api/health") &&
                contentType.includes("application/json");

              if (authenticated) {
                window.location.replace("/home/");
              }
            } catch (error) {
              // No valid SSO session or transient probe failure; keep the public landing.
            }
          }

          redirectAuthenticatedUsers();
        </script>
      </body>
    </html>
  home.html: |
    <!doctype html>
    <html lang="zh-CN">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>HomeLab Portal</title>
        <style>
          :root {
            --paper: #f4efe6;
            --ink: #171512;
            --muted: #6f6558;
            --panel: rgba(255, 248, 235, 0.8);
            --line: rgba(23, 21, 18, 0.12);
            --accent: #d65d0e;
            --accent-2: #1f6b5b;
            --shadow: 0 30px 80px rgba(33, 26, 18, 0.16);
          }

          * { box-sizing: border-box; }
          body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background:
              radial-gradient(circle at top left, rgba(214, 93, 14, 0.18), transparent 34%),
              radial-gradient(circle at right 20%, rgba(31, 107, 91, 0.16), transparent 28%),
              linear-gradient(160deg, #f8f1e4 0%, #ece1cf 52%, #e5d5c0 100%);
            font-family: "Avenir Next", "Segoe UI", sans-serif;
          }

          .shell { max-width: 1100px; margin: 0 auto; padding: 40px 24px 72px; }
          .hero {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 36px;
            background:
              linear-gradient(135deg, rgba(255,255,255,0.74), rgba(255,247,232,0.58)),
              rgba(255,255,255,0.55);
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow);
          }

          .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
          }

          .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(23, 21, 18, 0.05);
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }

          .eyebrow::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
          }

          .account {
            display: flex;
            align-items: center;
            gap: 12px;
          }

          .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.45);
            color: var(--muted);
            font-size: 13px;
          }

          .status-pill::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--accent-2);
          }

          .account-link {
            color: var(--ink);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            opacity: 0.84;
          }

          .account-link:hover { opacity: 1; }

          h1 {
            margin: 20px 0 12px;
            max-width: 680px;
            font-family: Iowan Old Style, "Palatino Linotype", "Book Antiqua", Palatino, serif;
            font-size: clamp(40px, 7vw, 72px);
            line-height: 0.94;
            letter-spacing: -0.04em;
          }

          .lead {
            max-width: 620px;
            margin: 0;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.65;
          }

          .meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
          .chip {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.45);
            font-size: 13px;
            color: var(--muted);
          }

          .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.9fr);
            gap: 22px;
            margin-top: 24px;
          }

          .card {
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            background: var(--panel);
            box-shadow: 0 12px 40px rgba(40, 29, 19, 0.08);
          }

          .card h2, .card h3 {
            margin: 0;
            font-family: Iowan Old Style, "Palatino Linotype", "Book Antiqua", Palatino, serif;
            letter-spacing: -0.03em;
          }

          .launch {
            display: block;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            border-radius: 22px;
            padding: 26px;
            min-height: 260px;
            border: 1px solid rgba(255,255,255,0.24);
            background:
              linear-gradient(135deg, rgba(22, 20, 18, 0.94), rgba(38, 35, 31, 0.92)),
              linear-gradient(135deg, rgba(214,93,14,0.26), rgba(31,107,91,0.18));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
          }

          .launch::after {
            content: "";
            position: absolute;
            inset: auto -60px -60px auto;
            width: 220px;
            height: 220px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(214,93,14,0.5), transparent 68%);
            filter: blur(4px);
          }

          .launch small, .launch p, .launch h2, .launch span { position: relative; z-index: 1; }
          .launch small {
            color: rgba(255,255,255,0.72);
            letter-spacing: 0.12em;
            text-transform: uppercase;
          }
          .launch h2 { margin-top: 14px; color: #fff8ef; font-size: 40px; }
          .launch p {
            max-width: 340px;
            margin: 14px 0 0;
            color: rgba(255,248,239,0.78);
            line-height: 1.6;
          }
          .pill {
            display: inline-flex;
            margin-top: 26px;
            border-radius: 999px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.18);
            color: #fff8ef;
            padding: 11px 16px;
            font-weight: 600;
          }

          .stack { display: grid; gap: 14px; margin-top: 18px; }
          .stack a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 18px;
            text-decoration: none;
            color: inherit;
            background: rgba(255,255,255,0.4);
          }
          .stack strong { display: block; font-size: 15px; }
          .stack span { color: var(--muted); font-size: 13px; }
          .arrow { color: var(--accent); font-size: 18px; font-weight: 700; }
          .caption { margin-top: 18px; color: var(--muted); font-size: 13px; line-height: 1.65; }

          @media (max-width: 860px) {
            .shell { padding: 20px 16px 48px; }
            .hero { padding: 24px; border-radius: 24px; }
            .grid { grid-template-columns: 1fr; }
            .launch { min-height: 220px; }
            .topbar { align-items: flex-start; flex-direction: column; }
          }
        </style>
      </head>
      <body>
        <main class="shell">
          <section class="hero">
            <div class="topbar">
              <span class="eyebrow">Authenticated Entry</span>
              <div class="account">
                <span class="status-pill">Authenticated</span>
                <a class="account-link" href="/auth/settings">设置</a>
                <a class="account-link" href="/auth/logout?rd=https%3A%2F%2F106.55.163.135%2F">退出</a>
              </div>
            </div>
            <h1>HomeLab Portal</h1>
            <p class="lead">
              当前登录态已经建立。这个页面只在认证后展示，用来承接真正的内部系统入口和账户相关动作。
            </p>
            <div class="meta">
              <span class="chip">GZ Public Edge</span>
              <span class="chip">Traefik + Gateway API</span>
              <span class="chip">Authelia SSO</span>
            </div>
            <div class="grid">
              <section class="primary">
                <a class="launch" href="/grafana/">
                  <small>Observability</small>
                  <h2>Grafana</h2>
                  <p>进入当前唯一对外公开接入的内部系统。这里聚合了监控、链路探测、边缘网关和节点健康数据。</p>
                  <span class="pill">Open Dashboard</span>
                </a>
              </section>
              <aside class="side">
                <section class="card">
                  <h3>Account</h3>
                  <div class="stack">
                    <a href="/auth/settings">
                      <div>
                        <strong>安全设置</strong>
                        <span>邮箱验证码、TOTP 与后续设备注册入口</span>
                      </div>
                      <span class="arrow">→</span>
                    </a>
                    <a href="/auth/logout?rd=https%3A%2F%2F106.55.163.135%2F">
                      <div>
                        <strong>退出 SSO</strong>
                        <span>清理当前 `Authelia` 会话，再回到当前门户</span>
                      </div>
                      <span class="arrow">→</span>
                    </a>
                  </div>
                </section>
                <section class="card">
                  <h3>Current Mode</h3>
                  <p class="caption">
                    当前门户页本身受统一认证保护。后续如果接入更多系统，继续沿用同一条 `Traefik + Authelia`
                    公共认证链路即可。
                  </p>
                </section>
              </aside>
            </div>
          </section>
        </main>
      </body>
    </html>
