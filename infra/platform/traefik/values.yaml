deployment:
  enabled: true
  kind: Deployment
  replicas: 1

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

hostNetwork: false

nodeSelector:
  edge.role: ingress

providers:
  kubernetesGateway:
    enabled: true
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true

gatewayClass:
  enabled: true
  name: homelab-traefik

gateway:
  enabled: false

ingressClass:
  enabled: false

service:
  enabled: true
  type: ClusterIP

ports:
  web:
    port: 80
    hostPort: 80
  websecure:
    port: 443
    hostPort: 443
  metrics:
    port: 9101

api:
  dashboard: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi
