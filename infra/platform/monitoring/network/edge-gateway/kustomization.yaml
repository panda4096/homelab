apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: edge-gateway-probe-exporter-script
    files:
      - edge_gateway_probe_exporter.py
  - name: edge-gateway-traffic-exporter-script
    files:
      - edge_gateway_traffic_exporter.py

resources:
  - edge-gateway.yaml
  - traffic-exporter.yaml
