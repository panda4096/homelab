apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-gateway-probe-exporter
  labels:
    app.kubernetes.io/name: edge-gateway-probe-exporter
    app.kubernetes.io/part-of: network-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway-probe-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-gateway-probe-exporter
        app.kubernetes.io/part-of: network-monitoring
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        edge.role: ingress
      containers:
        - name: exporter
          image: docker.io/library/busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - exec chroot /host /usr/bin/python3 /opt/edge/probe/scripts/edge_gateway_probe_exporter.py
          env:
            - name: EDGE_GATEWAY_PROBE_CONFIG
              value: /opt/edge/probe/config/probe-config.json
            - name: LISTEN_PORT
              value: "9808"
            - name: SCRAPE_INTERVAL_SECONDS
              value: "30"
            - name: PROBE_TIMEOUT_SECONDS
              value: "10"
          ports:
            - name: metrics
              containerPort: 9808
              hostPort: 9808
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["SYS_CHROOT"]
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: script
              mountPath: /host/opt/edge/probe/scripts
              readOnly: true
            - name: probe-config
              mountPath: /host/opt/edge/probe/config
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: script
          configMap:
            name: edge-gateway-probe-exporter-script
            defaultMode: 0555
        - name: probe-config
          secret:
            secretName: edge-gateway-probe-config
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway-probe-exporter
  labels:
    app.kubernetes.io/name: edge-gateway-probe-exporter
    app.kubernetes.io/part-of: network-monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: edge-gateway-probe-exporter
  ports:
    - name: metrics
      port: 9808
      targetPort: metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: edge-gateway-probe-exporter
  labels:
    app.kubernetes.io/part-of: network-monitoring
spec:
  attach_metadata:
    node: true
  namespaceSelector:
    matchNames: ["monitoring"]
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-gateway-probe-exporter
  podMetricsEndpoints:
    - port: metrics
      relabelConfigs:
        - action: replace
          sourceLabels: ["__meta_kubernetes_pod_node_name"]
          regex: (.+)
          targetLabel: node
        - action: replace
          sourceLabels: ["__meta_kubernetes_pod_node_name"]
          regex: (.+)
          targetLabel: instance
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: edge-gateway-probe-rules
  labels:
    app.kubernetes.io/part-of: network-monitoring
spec:
  groups:
    - name: edge-gateway-probes
      rules:
        - alert: EdgeGatewayHttpConnectProbeFailed
          expr: max_over_time(edge_gateway_probe_success{probe_type="http_connect_generate_204"}[3m]) == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "edge gateway HTTP CONNECT probe failed"
            description: "instance={{ $labels.instance }}"
        - alert: EdgeGatewaySocks5ProbeFailed
          expr: max_over_time(edge_gateway_probe_success{probe_type="socks5_generate_204"}[3m]) == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "edge gateway SOCKS5 probe failed"
            description: "instance={{ $labels.instance }}"
        - alert: EdgeGatewayProxyLatencyHigh
          expr: avg_over_time(edge_gateway_probe_duration_seconds{probe_type=~"http_connect_generate_204|socks5_generate_204"}[10m]) > 1.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "edge gateway proxy latency high"
            description: "instance={{ $labels.instance }} probe_type={{ $labels.probe_type }}"
        - alert: EdgeGatewayUnexpectedExitIp
          expr: edge_gateway_probe_success{probe_type=~"http_connect_ip_echo|socks5_ip_echo"} == 1 and edge_gateway_probe_exit_ip_match{probe_type=~"http_connect_ip_echo|socks5_ip_echo"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "edge gateway observed unexpected exit IP"
            description: "instance={{ $labels.instance }} probe_type={{ $labels.probe_type }}"
