apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: blackbox-exporter-config
    files:
      - blackbox.yml
  - name: network-probe-reconciler-script
    files:
      - reconcile_network_probes.py

resources:
  - phase1.yaml
